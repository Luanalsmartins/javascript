<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Contador</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Vamos contar</h1>
    </header>
    <section>
        <div>
            <label for="iinicio">Início: </label>
            <input type="number" name="inicio" id="iinicio"> <br>

            <label for="ifim">Fim: </label>
            <input type="number" name="fim" id="ifim"> <br>

            <label for="ipasso">Passo: </label>
            <input type="number" name="Passo" id="ipasso"> <br>
            
            <input type="submit" value="Contar">
        </div>
        <div id="resultado">
            Preparando a contagem...
        </div>
    </section>
    <footer>
        <p>&copy; Luana L S Martins</p>
    </footer>

    <script src="script.js"></script>

</html>
