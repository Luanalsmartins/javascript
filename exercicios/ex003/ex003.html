<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primeiro programa...</title>
    <style>
        body {
            background-color: rgb(152, 229, 255);
            color: white;
            font: normal 20pt arial;
        }
        h1 {
            color: rgb(240, 62, 91);
        }
    </style>
</head>
<body>
    <h1>Olá, mundo!</h1>
    <p>Já me livrei da maldição!</p>
    <script> // Aqui começa o nosso JS
        var n1 = Number(window.prompt('Digite um número: ')) // string
        var n2 = Number(window.prompt('Digite outro número: ')) // string
        var s = n1 + n2 
        window.alert(`A soma entre ${n1} e ${n2} é igual a ${s}`)
        /* window.alert('A soma dos valores é ' + String(s))*/ // Concatenação
        // (number + number) para adição
        // (string + string) para concatenação
    </script>
</body>
