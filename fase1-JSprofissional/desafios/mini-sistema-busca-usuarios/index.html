<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busca de Usuários</title>
</head>
<body>
    <h1>Usuários</h1>

    <input type="text" id="busca" placeholder="Digite um nome...">

    <ul id="lista"></ul>

    <script>
        let busca = document.getElementById("busca")
        let lista = document.getElementById("lista")
        const itens = lista.getElementsByTagName("li")

        fetch("https://jsonplaceholder.typicode.com/users")
            .then(response => {  
                return response.json()
            })
            .then(data => {
                data.sort((a, b) => a.name.localeCompare(b.name))
                data.forEach(nome => {
                    lista.innerHTML += `<li>${nome.name}</li>`
                })
            })
            busca.addEventListener('input', function(e) {
                const letra = e.target.value.toLowerCase()

                Array.from(itens).forEach(funciton(item) {
                    if (nome.toLowerCase().indexOf(letra) != -1) {
                        item.style.display = 'block'
                    } else {
                        item.style.display = 'none'
                    }
                })
            })
    </script>
</body>
</html>
