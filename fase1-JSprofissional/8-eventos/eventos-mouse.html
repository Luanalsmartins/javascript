<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos do mouse</title>
    <style>
        button {
            height: 200px;
            width: 300px;
            font-size: 1.5em;
        }
    </style>
</head>
<body>
    <button class="caixa">Passe o mouse aqui</button>

    <script>
        const caixa = document.querySelector(".caixa")

        caixa.addEventListener("mouseenter", function() {
            caixa.style.background = "red"
        })
        caixa.addEventListener("mouseleave", function() {
            caixa.style.background = "blue"
        })
    </script>
</body>
</html>
