<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sobre classList</title>
    <style>
        .vermelho {
            color: red;
        }
        .blue {
            background-color: lightblue;
        }
    </style>
</head>
<body>
    <p id="texto" class="blue">Olá mundo!</p>

    <script>
        const texto = document.getElementById("texto")

        texto.classList.add("vermelho")
        texto.classList.remove("blue")
    </script>
</body>
</html>
