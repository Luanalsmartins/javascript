<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reajuste Salarial</title>
    <style>
        body {
            font: normal 1em arial;
        }
        input {
            font-size: 1.5em;
            height: 100px;
            padding: 20px;
        }
        input:hover {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Reajuste Salarial</h1>

    <input type="button" value="Reajustar salário" onclick="iniciar()">

    <div id="resultado">
        <p>Clique no botão para inciar.</p>
    </div>

    <script>
        function iniciar() {
            let funcionário = window.prompt('Qual é o nome do funcionário?')
            let salário = window.prompt(`Qual é o salário de ${funcionário}?`)
            let aumento = window.prompt(`O salário de ${funcionário} vai ser reajustado em qual porcentagem?`)
            let resultado = document.getElementById('resultado')

            let NumSalario = Number(salário.replace(',', '.'))
            let valorAumento = NumSalario * (aumento * 0.01)
            let salarioFinal = NumSalario + valorAumento
            
            resultado.innerHTML = `
            <h1>${funcionário} recebeu um aumento salarial!</h1>
            <p>O salário atual era ${NumSalario.toLocaleString ('pt-BR', {style: 'currency', currency: 'BRL'})}.</p>
            <p>Com um aumento de ${aumento}%, o salário vai aumentar ${valorAumento.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'})} no próximo mês</p>
            <p>E a partir daí, ${funcionário} vai passar a ganhar ${salarioFinal.toLocaleString ('pt-BR', {style: 'currency', currency: 'BRL'})}.</p>
            `
        }
    </script>
</body>
</html>
