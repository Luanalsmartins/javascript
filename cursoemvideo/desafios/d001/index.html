<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensagens</title>
    <style>
        body {
            font: normal 20pt arial;
            display: flex;
            justify-content: center;
            gap: 50px;
        }
        div {
            background: linear-gradient(rgb(12, 129, 127), rgb(204, 248, 246));
            border: 1px solid black;
            border-radius: 15px;
            height: 200px;
            width: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        div:hover {
            background: rgb(12, 131, 129);
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="b1">Botão 1</div>
    <div id="b2">Botão 2</div>
    <div id="b3">Botão 3</div>

    <script>
        const b1 = document.querySelector('#b1')
        const b2 = document.querySelector('#b2')
        const b3 = document.querySelector('#b3')

        b1.addEventListener('click', () => clicar(1))
        b2.addEventListener('click', () => clicar(2))
        b3.addEventListener('click', () => clicar(3))

        function clicar(numero) {
        alert(`Você clicou no ${numero}° botão`)
        }

    </script>
</body>
</html>
