<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo de Desconto</title>
    <style>
        body {
            font: normal 1em arial;
        }
        input {
            font-size: 1.5em;
            height: 100px;
            padding: 20px;
        }
        input:hover {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Calcular Desconto</h1>

    <input type="button" value="Desconto de 10%" onclick="iniciar()">

    <div id="resultado">
        <p>Clique no botão para inciar.</p>
    </div>

    <script>
        function iniciar() {
            let produto = window.prompt('Qual é o produto que você está comprando?')
            let preço = window.prompt(`Qual é o preço do(a) ${produto}?`)
            let resultado = document.getElementById('resultado')

            let NumPreço = Number(preço.replace(',', '.'))
            let desconto = NumPreço * 0.10
            let preçoFinal = NumPreço - desconto

            resultado.innerHTML = `
            <h1>Calculando o desconto de 10% para ${produto}</h1>
            <p>O preço original era ${NumPreço.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'})}</p>
            <p>Você acaba de ganhar ${desconto.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'})} de desconto (-10%).</p>
            <p>No fim, você vai pagar ${preçoFinal.toLocaleString ('pt-BR', {style: 'currency', currency: 'BRL'})} no produto ${produto}.</p>
            `
        }
    </script>
</body>
</html>
