<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fórmula de Bhaskara</title>
    <style>
        body {
            font: normal 1em arial;
        }
        input {
            font-size: 1.5em;
            height: 100px;
            padding: 20px;
        }
        input:hover {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Resolvendo Bhaskara</h1>

    <input type="button" value="Calcular" onclick="iniciar()">

    <div id="resultado">
        <p>Considerando uma equação no formato <strong><em>ax <sup>2</sup> + bx + c = 0</em></strong>, aperte o botão acima para calcular o valor de &Delta;</p>
    </div>

    <script>
        function iniciar() {
            let a = window.prompt('Qual é o valor de a?')
            let b = window.prompt('Qual é o valor de b')
            let c = window.prompt('Qual é o valor de c?')
            let resultado = document.getElementById('resultado')

            // Delta = b ** 2 - 4 * a * c
            let calculoDelta = b ** 2 - 4 * a * c

            resultado.innerHTML = `
            <h1>Resolvendo Bhaskara</h1>
            <p>A equação atual é <strong>${a}x<sup>2</sup> + ${b}x + ${c} = 0</strong></p>
            <p>O cálculo realizado será <strong>&Delta; = ${b}<sup>2</sup> - 4 . ${a} . ${c}</strong></p>
            <p>O valor calculado foi <mark><strong>&Delta; = ${calculoDelta}</strong></mark></p>
            `
        }
    </script>
</body>
</html>
